<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>PenDraw Party — Player</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --bg:#0b0b10; --panel:#16161f; --line:#262633; --accent:#5b8cff; --good:#39d98a; --bad:#ff5a5a; }
    html, body { height:100%; background:var(--bg); color:#fff; font-family:-apple-system, Segoe UI, Roboto, sans-serif; overflow:hidden; }

    /* JOIN */
    #join { min-height:100%; display:flex; flex-direction:column; justify-content:center; padding:18px; max-width:520px; margin:0 auto; width:100%; }
    h1 { font-size:22px; } .muted { color:#9aa; }
    input { font-size:18px; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:#12121a; color:#fff; width:100%; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
    #joinBtn { font-size:18px; font-weight:700; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#fff; cursor:pointer; width:100%; }

    /* IN-GAME (full screen) */
    #game { display:none; }
    #pad { position:fixed; inset:0; background:#000; touch-action:none; }
    #sketch { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    #penDot { position:absolute; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); pointer-events:none; display:none; }

    .ov { position:fixed; pointer-events:none; text-shadow:0 1px 6px rgba(0,0,0,0.95); z-index:5; }
    #wordOv { top:12px; left:50%; transform:translateX(-50%); text-align:center; display:none; }
    #wordOv .wl { display:block; color:rgba(255,255,255,0.7); font-size:13px; }
    #wordOv .ww { display:block; color:var(--good); font-weight:800; font-size:26px; letter-spacing:1px; }
    #promptOv { top:14px; left:50%; transform:translateX(-50%); text-align:center; font-size:16px; font-weight:600; max-width:60vw; display:none; }
    #scoreOv { top:12px; right:12px; display:none; }
    #scoreTable { border-collapse:collapse; font-size:14px; background:rgba(255,255,255,0.06); border-radius:8px; }
    #scoreTable td { padding:3px 10px; }
    #scoreTable td.sc { text-align:right; font-weight:800; font-variant-numeric:tabular-nums; }
    #scoreTable tr.drawing td { color:var(--accent); }
    #feedOv { bottom:78px; left:12px; max-width:72vw; display:none; flex-direction:column; gap:2px; font-size:16px; }
    #feedOv .ok { color:var(--good); font-weight:800; }
    #feedOv .bad { color:var(--bad); font-weight:800; }

    #drawerBtns { position:fixed; top:12px; left:12px; display:none; gap:8px; z-index:6; }
    #drawerBtns button { width:auto; background:rgba(255,255,255,0.9); color:#111; font-size:14px; font-weight:700; padding:9px 14px; border:0; border-radius:9px; cursor:pointer; }

    #guessBar { position:fixed; bottom:14px; left:12px; right:12px; display:none; gap:10px; z-index:6; }
    #guessBar input { flex:1; }
    #guessBar button { width:auto; background:var(--accent); color:#fff; font-size:16px; font-weight:700; padding:12px 18px; border:0; border-radius:10px; cursor:pointer; }

    #reveal { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.5); gap:8px; pointer-events:none; z-index:7; }
    #reveal .w { font-size:44px; font-weight:800; color:var(--good); }
    #nextBtn { position:fixed; bottom:14px; right:14px; display:none; width:auto; background:rgba(42,42,56,0.92); color:#fff; font-size:15px; font-weight:700; padding:11px 18px; border:0; border-radius:10px; cursor:pointer; z-index:9; }

    #msgBox { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:8px;
      background:var(--bg); z-index:8; padding:24px; text-align:center; }
    #msgBox .big { font-size:26px; font-weight:800; }
    #msgScores { margin-top:12px; width:100%; max-width:360px; }
    #msgScores .row { display:flex; justify-content:space-between; padding:6px 2px; border-bottom:1px solid var(--line); }
  </style>
</head>
<body>
  <div id="join">
    <h1>🎨 PenDraw Party</h1>
    <p class="muted" style="margin:6px 0 14px">Enter the code shown on the big screen.</p>
    <div class="card" style="display:flex; flex-direction:column; gap:12px">
      <input id="codeIn" inputmode="numeric" placeholder="Room code (e.g. 483920)" maxlength="6" />
      <input id="nameIn" placeholder="Your name" maxlength="16" />
      <button id="joinBtn">Join game</button>
      <div id="joinErr" style="color:#f77; text-align:center"></div>
    </div>
  </div>

  <div id="game">
    <div id="pad"><canvas id="sketch"></canvas><div id="penDot"></div></div>

    <div id="wordOv" class="ov"><span class="wl">Draw this (only you can see it):</span><span class="ww" id="wordText"></span></div>
    <div id="promptOv" class="ov"></div>
    <div id="scoreOv" class="ov"><table id="scoreTable"></table></div>
    <div id="feedOv" class="ov"></div>

    <div id="drawerBtns">
      <button id="modeBtn">✋ Finger</button>
      <button id="recenterBtn" style="display:none">Recenter</button>
      <button id="clearBtn">Clear</button>
      <button id="skipBtn">Skip</button>
    </div>
    <div id="guessBar">
      <input id="guessIn" placeholder="your guess" autocomplete="off" />
      <button id="guessSend">Send</button>
    </div>

    <div id="reveal">
      <div>The word was</div>
      <div class="w" id="revealWord"></div>
      <div id="revealWho" style="color:#bcd"></div>
    </div>
    <button id="nextBtn">Next round ▶</button>

    <div id="msgBox">
      <div class="big" id="msgTitle"></div>
      <div class="muted" id="msgSub"></div>
      <div id="msgScores"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, get, set, push, remove, onValue, onChildAdded, onDisconnect, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { firebaseConfig } from "./firebase-config.js";

    const db = getDatabase(initializeApp(firebaseConfig));
    const $ = (id)=>document.getElementById(id);
    const esc = (s)=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const pid = "p_" + Math.random().toString(36).slice(2,10);

    let code=null, name=null;
    let status=null, round={}, players={};
    let role=null;            // 'drawer' | 'guesser' | null
    let lastRoundN=null;
    let inputMode='finger';   // 'finger' | 'tilt' (phone orientation, like the app)

    const q = new URLSearchParams(location.search).get("room"); if(q) $("codeIn").value=q;

    $("joinBtn").onclick = async () => {
      code = ($("codeIn").value||"").trim(); name = ($("nameIn").value||"").trim();
      if(code.length<4 || !name){ $("joinErr").textContent="Enter a code and your name."; return; }
      const s = await get(ref(db,`rooms/${code}`));
      if(!s.exists()){ $("joinErr").textContent="No room with that code."; return; }
      await set(ref(db,`rooms/${code}/players/${pid}`), { name, score:0, joinedAt: serverTimestamp() });
      onDisconnect(ref(db,`rooms/${code}/players/${pid}`)).remove();
      $("join").style.display="none"; $("game").style.display="block";
      startGame();
    };

    // ---------- sketch canvas (shown to drawer AND guessers) ----------
    const canvas=$("sketch"), cx=canvas.getContext("2d");
    let W=0,H=0, pts=[];
    function sizeCanvas(){ const dpr=devicePixelRatio||1, r=canvas.getBoundingClientRect();
      W=r.width; H=r.height; canvas.width=W*dpr; canvas.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0); redraw(); }
    addEventListener("resize", sizeCanvas);
    function redraw(){ cx.clearRect(0,0,W,H); if(pts.length<1) return; cx.strokeStyle="#fff"; cx.lineWidth=4; cx.lineJoin="round"; cx.lineCap="round";
      cx.beginPath(); for(let i=0;i<pts.length;i++){ const p=pts[i]; if(i===0||p.m) cx.moveTo(p.x*W,p.y*H); else cx.lineTo(p.x*W,p.y*H); } cx.stroke(); }
    function addSeg(p){ const prev=pts[pts.length-1]; pts.push(p); if(!prev||p.m) return;
      cx.strokeStyle="#fff"; cx.lineWidth=4; cx.lineJoin="round"; cx.lineCap="round";
      cx.beginPath(); cx.moveTo(prev.x*W,prev.y*H); cx.lineTo(p.x*W,p.y*H); cx.stroke(); }
    function resetSketch(){ pts=[]; cx.clearRect(0,0,W,H); }

    // ---------- drawing input (only when it's your turn) ----------
    const pad=$("pad"), dot=$("penDot");
    let drawing=false, last=0;
    const pointsRef = () => ref(db,`rooms/${code}/drawing/points`);
    function sendPoint(e, isStart){
      const rect=pad.getBoundingClientRect();
      const nx=Math.min(Math.max((e.clientX-rect.left)/rect.width,0),1);
      const ny=Math.min(Math.max((e.clientY-rect.top)/rect.height,0),1);
      dot.style.left=(e.clientX-rect.left)+"px"; dot.style.top=(e.clientY-rect.top)+"px";
      const now=performance.now();
      if(isStart){ last=now; const p={x:nx,y:ny,m:true}; addSeg(p); push(pointsRef(),p); return; }
      if(now-last>=40){ last=now; const p={x:nx,y:ny}; addSeg(p); push(pointsRef(),p); }
    }
    pad.addEventListener("pointerdown",(e)=>{ if(role!=="drawer" || inputMode!=="finger") return; drawing=true; pad.setPointerCapture(e.pointerId); sendPoint(e,true); });
    pad.addEventListener("pointermove",(e)=>{ if(drawing) sendPoint(e); });
    pad.addEventListener("pointerup",  ()=>{ drawing=false; });

    $("clearBtn").onclick = ()=>{ if(role!=="drawer") return; resetSketch(); remove(pointsRef()); set(ref(db,`rooms/${code}/drawing/clear`), Date.now()); };
    $("skipBtn").onclick  = ()=>{ if(role!=="drawer") return; set(ref(db,`rooms/${code}/skip`), Date.now()); };

    // ---------- tilt (phone orientation) input — like the native app ----------
    const YAW_GAIN=1.6, PITCH_GAIN=3.0;
    const clampN=(v,lo,hi)=>Math.min(Math.max(v,lo),hi);
    const wrapPi=(a)=>{ a=a%(2*Math.PI); if(a>Math.PI)a-=2*Math.PI; if(a<-Math.PI)a+=2*Math.PI; return a; };
    let calib={yaw0:0,pitch0:0,anchorX:0.5,anchorY:0.5}, needsCalib=false, pendingBreak=false;
    let tiltLast=null, tiltLastT=0, orientAttached=false;

    function tiltToNorm(yaw,pitch){
      const dYaw=wrapPi(yaw-calib.yaw0);
      const normX=clampN(calib.anchorX-(dYaw*YAW_GAIN)/Math.PI,0,1);
      const normY=clampN(calib.anchorY-((pitch-calib.pitch0)*PITCH_GAIN)/Math.PI,0,1);
      return {normX,normY};
    }
    function onOrient(e){
      if(role!=="drawer" || inputMode!=="tilt" || e.alpha==null || e.beta==null) return;
      const yaw=e.alpha*Math.PI/180, pitch=e.beta*Math.PI/180;
      if(needsCalib){ calib={yaw0:yaw,pitch0:pitch,anchorX:0.5,anchorY:0.5}; needsCalib=false; tiltLast=null; pendingBreak=true; }
      const {normX,normY}=tiltToNorm(yaw,pitch);
      dot.style.left=(normX*W)+"px"; dot.style.top=(normY*H)+"px";
      const now=performance.now();
      if(now-tiltLastT<30) return;
      if(tiltLast && Math.hypot(normX-tiltLast.x,normY-tiltLast.y)<0.005) return;
      tiltLastT=now; tiltLast={x:normX,y:normY};
      const p={x:normX,y:normY}; if(pendingBreak){ p.m=true; pendingBreak=false; }
      addSeg(p); push(pointsRef(),p);
    }
    async function enableTilt(){
      try {
        if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
          const res=await DeviceOrientationEvent.requestPermission();
          if(res!=="granted"){ alert("Motion access denied — staying on Finger."); inputMode="finger"; updateModeUI(); return; }
        }
        if(!orientAttached){ addEventListener("deviceorientation", onOrient); orientAttached=true; }
        needsCalib=true;
      } catch(err){ alert("Tilt isn't available here — staying on Finger."); inputMode="finger"; updateModeUI(); }
    }
    function updateModeUI(){
      $("modeBtn").textContent = inputMode==="tilt" ? "📱 Tilt" : "✋ Finger";
      $("recenterBtn").style.display = inputMode==="tilt" ? "inline-block" : "none";
    }
    $("modeBtn").onclick = async ()=>{
      if(role!=="drawer") return;
      if(inputMode==="finger"){ inputMode="tilt"; await enableTilt(); } else { inputMode="finger"; }
      updateModeUI();
    };
    $("recenterBtn").onclick = ()=>{ if(inputMode==="tilt") needsCalib=true; };

    // ---------- guessing ----------
    function sendGuess(){ const t=($("guessIn").value||"").trim(); if(!t) return;
      push(ref(db,`rooms/${code}/guesses`), { pid, name, text:t }); $("guessIn").value=""; }
    $("guessSend").onclick = sendGuess;
    $("guessIn").addEventListener("keydown",(e)=>{ if(e.key==="Enter") sendGuess(); });
    $("nextBtn").onclick = ()=>{ set(ref(db,`rooms/${code}/next`), Date.now()); };

    // ---------- feed + scoreboard ----------
    function renderFeedEntry(f){ if(!f) return; const d=document.createElement("span");
      d.innerHTML = f.correct ? `${esc(f.name)} <span class="ok">guessed</span> it!` : `${esc(f.name)}: <span class="bad">${esc(f.text)}</span>`;
      const el=$("feedOv"); el.appendChild(d); while(el.children.length>6) el.removeChild(el.firstChild); }
    function renderScoreboard(){
      const arr=Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0));
      $("scoreTable").innerHTML = arr.map(([id,p])=>`<tr class="${id===round.drawerId?'drawing':''}"><td>${esc(p.name||'?')}${id===round.drawerId?' ✏️':''}</td><td class="sc">${p.score||0}</td></tr>`).join("");
    }

    // ---------- listeners ----------
    function startGame(){
      sizeCanvas();
      ["status","round","players"].forEach((p)=> onValue(ref(db,`rooms/${code}/${p}`), (snap)=>{
        if(p==="status") status = snap.val();
        else if(p==="round") round = snap.val()||{};
        else players = snap.val()||{};
        onState();
      }));
      // sketch: render incoming points only when I'm a guesser (the drawer draws locally)
      onChildAdded(pointsRef(), (s)=>{ const v=s.val(); if(v&&typeof v.x==="number" && role==="guesser") addSeg(v); });
      onValue(ref(db,`rooms/${code}/drawing/clear`), (s)=>{ if(s.exists()) resetSketch(); });
      onChildAdded(ref(db,`rooms/${code}/feed`), (s)=> renderFeedEntry(s.val()));
    }

    function onState(){
      if(round.n !== lastRoundN){ lastRoundN = round.n; resetSketch(); $("feedOv").innerHTML=""; if(inputMode==="tilt") needsCalib=true; }
      const playing = status==="playing";
      const ended = status==="roundEnd";
      const inGame = playing || ended;
      role = playing ? (round.drawerId===pid ? "drawer" : "guesser") : null;
      const iAmDrawer = role==="drawer";
      const iGuessedRight = !!(round.correctGuessers && round.correctGuessers[pid]);

      renderScoreboard();

      $("wordText").textContent = (round.word||"").toUpperCase();
      $("wordOv").style.display     = (playing && iAmDrawer) ? "block" : "none";
      $("promptOv").textContent     = (playing && !iAmDrawer) ? `Guess what ${players[round.drawerId]?.name||"someone"} is drawing 👀` : "";
      $("promptOv").style.display   = (playing && !iAmDrawer) ? "block" : "none";
      $("scoreOv").style.display    = inGame ? "block" : "none";
      $("feedOv").style.display     = inGame ? "flex" : "none";
      $("drawerBtns").style.display = (playing && iAmDrawer) ? "flex" : "none";
      $("guessBar").style.display   = (playing && !iAmDrawer && !iGuessedRight) ? "flex" : "none";
      $("penDot").style.display     = (playing && iAmDrawer) ? "block" : "none";

      // round-end reveal (transparent, over the sketch) + Next round button — like the big screen
      $("reveal").style.display  = ended ? "flex" : "none";
      $("nextBtn").style.display = ended ? "inline-block" : "none";
      if(ended){
        $("revealWord").textContent = (round.word||"?");
        const names = Object.keys(round.correctGuessers||{}).map(id=>players[id]?.name).filter(Boolean);
        $("revealWho").textContent = names.length ? ("Guessed by: "+names.join(", ")) : "Nobody guessed it";
      }

      // only the lobby uses the full-screen message box
      const lobby = !inGame;
      $("msgBox").style.display = lobby ? "flex" : "none";
      if(lobby){
        $("msgTitle").textContent = "You're in! 🎉";
        $("msgSub").textContent = `Waiting for the host to start… (${Object.keys(players).length} in the room)`;
        $("msgScores").innerHTML = "";
      }
    }
  </script>
</body>
</html>
